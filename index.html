var cv=document.getElementById('c');
var W=0,H=0,DPR=1;
var ctx=cv.getContext('2d');
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

var BG='#060812',STAR_C=[180,200,255];
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var TAU=Math.PI*2;

var settings={masterVolume:.8,musicVolume:.7,sfxVolume:.8,showFps:false};
var actx=null;
function initAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,t,v,st){if(!actx)return;var n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(st)o.frequency.exponentialRampToValueAtTime(Math.max(1,st),n+d);var fv=(v||.08)*settings.masterVolume*settings.sfxVolume;g.gain.setValueAtTime(fv,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+d)}
function noise(d,v,ff){if(!actx)return;var n=actx.currentTime,bs=Math.floor(actx.sampleRate*d),b=actx.createBuffer(1,bs,actx.sampleRate),dt=b.getChannelData(0);for(var i=0;i<bs;i++)dt[i]=Math.random()*2-1;var s=actx.createBufferSource();s.buffer=b;var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(ff||1200,n);f.frequency.exponentialRampToValueAtTime(200,n+d);var g=actx.createGain();var fv=(v||.15)*settings.masterVolume*settings.sfxVolume;g.gain.setValueAtTime(fv,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(f);f.connect(g);g.connect(actx.destination);s.start(n);s.stop(n+d)}

var SFX={
  missile:function(){tone(1200,.05,'square',.03,300)},
  ebullet:function(){tone(320,.08,'sawtooth',.02,160)},
  hitEnemy:function(){tone(180,.05,'square',.05,80)},
  explode:function(){noise(.35,.18,1400);tone(140,.25,'sawtooth',.06,40)},
  hurt:function(){tone(160,.18,'sawtooth',.12,60)},

  coin:function(){tone(1400,.06,'triangle',.05);setTimeout(function(){tone(1800,.09,'triangle',.05)},60)},
  buy:function(){tone(880,.1,'triangle',.1);setTimeout(function(){tone(1320,.15,'triangle',.1)},80);setTimeout(function(){tone(1760,.2,'triangle',.08)},160)},

  bossDie:function(){noise(1.2,.3,800);[330,220,165,110].forEach(function(f,i){setTimeout(function(){tone(f,.5,'sawtooth',.15,f*.4)},i*200)})},
  laserOn:function(){tone(2000,.08,'sawtooth',.06,400);noise(.1,.05,3000)},

  bossSummon:function(){tone(140,.5,'sawtooth',.1,400);noise(.35,.15,1000)},

};

function SpaceMusic(ctx){
  this.ctx=ctx;this.master=ctx.createGain();this.master.gain.value=0;this.master.connect(ctx.destination);
  this.started=false;this.step=0;this.nextTime=0;this.theme='normal';
}
SpaceMusic.prototype._pad=function(freqs,time,dur){
  var ctx=this.ctx,isBoss=this.theme!=='normal';
  for(var i=0;i<freqs.length;i++){
    var o=ctx.createOscillator();o.type=isBoss?'sawtooth':'triangle';o.frequency.value=freqs[i]*(isBoss?1:2);
    var filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=isBoss?1600:900;
    var g=ctx.createGain();g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(isBoss?.05:.04,time+dur*.3);g.gain.linearRampToValueAtTime(0,time+dur);
    o.connect(filt);filt.connect(g);g.connect(this.master);o.start(time);o.stop(time+dur+.2);
  }
};
SpaceMusic.prototype.start=function(){
  if(this.started)return;this.started=true;
  var now=this.ctx.currentTime;this.master.gain.cancelScheduledValues(now);this.master.gain.setValueAtTime(0,now);
  this.master.gain.linearRampToValueAtTime(.3*settings.masterVolume*settings.musicVolume,now+3);
  this.nextTime=now+.2;
  var ctx=this.ctx;
  var dg=ctx.createGain();dg.gain.value=.15;
  var df=ctx.createBiquadFilter();df.type='lowpass';df.frequency.value=200;df.Q.value=6;
  df.connect(dg);dg.connect(this.master);
  for(var i=0;i<2;i++){
    var o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=55+(i===0?-9:9)*0.1;
    o.connect(df);o.start();
  }
  this._schedule();
};
SpaceMusic.prototype.stop=function(){
  if(!this.started)return;this.started=false;
  var now=this.ctx.currentTime;this.master.gain.cancelScheduledValues(now);this.master.gain.linearRampToValueAtTime(0,now+1.2);
  clearTimeout(this._timer);
};
SpaceMusic.prototype.setTheme=function(t){if(this.theme===t)return;this.theme=t};
SpaceMusic.prototype.updateVolume=function(){
  if(!this.started)return;
  var now=this.ctx.currentTime;this.master.gain.cancelScheduledValues(now);
  this.master.gain.linearRampToValueAtTime(.3*settings.masterVolume*settings.musicVolume,now+.3);
};
SpaceMusic.prototype._schedule=function(){
  var ctx=this.ctx,isBoss=this.theme!=='normal';
  var beatDur=isBoss?.28:.5;
  var chords=isBoss?
    [[110,130.81,155.56],[103.83,123.47,146.83],[98,116.54,138.59]]:
    [[220,261.63,329.63],[196,246.94,293.66],[174.61,220,261.63],[130.81,164.81,196]];
  var scale=isBoss?[110,123.47,130.81,146.83,164.81]:[220,261.63,293.66,329.63,392,440];
  while(this.nextTime<ctx.currentTime+3){
    var barIdx=Math.floor(this.step/8);
    var chord=chords[barIdx%chords.length];
    if(this.step%8===0)this._pad(chord,this.nextTime,beatDur*8.2);
    if(this.step%2===0&&Math.random()<.6){
      var n=scale[Math.floor(Math.random()*scale.length)];
      var o=ctx.createOscillator();o.type=isBoss?'square':'triangle';o.frequency.value=n;
      var g=ctx.createGain();g.gain.setValueAtTime(0,this.nextTime);g.gain.linearRampToValueAtTime(.025,this.nextTime+.01);
      g.gain.exponentialRampToValueAtTime(.001,this.nextTime+(isBoss?.3:.55));
      o.connect(g);g.connect(this.master);o.start(this.nextTime);o.stop(this.nextTime+.6);
    }
    this.nextTime+=beatDur;this.step++;
  }
  var s=this;this._timer=setTimeout(function(){s._schedule()},500);
};

function btnLayout(){
  return {
    fire:{x:W-90,y:H-100,r:48},
    skill:{x:W-180,y:H-100,r:38},
    ult:{x:W-90,y:H-195,r:40}

function pointInBtn(px,py,b){return Math.hypot(px-b.x,py-b.y)<=b.r}

cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(paused)return;
  if(gameOver){backToMenu();return}
  var L=btnLayout();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],x=t.clientX,y=t.clientY;
    if(x>=W*0.5){
      if(pointInBtn(x,y,L.fire)&&!fireBtn.active){fireBtn.active=true;fireBtn.id=t.identifier}
      else if(pointInBtn(x,y,L.skill)&&!skillBtn.active){skillBtn.active=true;skillBtn.id=t.identifier}
      else if(pointInBtn(x,y,L.ult)&&!ultBtn.active){ultBtn.active=true;ultBtn.id=t.identifier;tryUltimate()}
    } else {
      if(!joy.active){joy.active=true;joy.id=t.identifier;joy.cx=x;joy.cy=y;joy.x=x;joy.y=y}
    }
  }
},{passive:false});

cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joy.id){
      var dx=t.clientX-joy.cx,dy=t.clientY-joy.cy;
      var d=Math.hypot(dx,dy);
      if(d>joy.max){dx=dx/d*joy.max;dy=dy/d*joy.max}
      joy.x=joy.cx+dx;joy.y=joy.cy+dy;
    }
  }
},{passive:false});

function endTouch(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joy.id){joy.active=false;joy.id=null}
    if(t.identifier===fireBtn.id){fireBtn.active=false;fireBtn.id=null}
    if(t.identifier===skillBtn.id){skillBtn.active=false;skillBtn.id=null}
    if(t.identifier===ultBtn.id){ultBtn.active=false;ultBtn.id=null}
  }
}

function makeP(x,y,a,s){
  var ca=Math.cos(a),sa=Math.sin(a);
  return function(lx,ly){return [x+(lx*s)*ca-(ly*s)*sa,y+(lx*s)*sa+(ly*s)*ca]};
}
function fillPoly(g,P,pts,fill,stroke,lw){
  g.beginPath();
  for(var i=0;i<pts.length;i++){var p=P(pts[i][0],pts[i][1]);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  g.closePath();
  if(fill){g.fillStyle=fill;g.fill()}
  if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke()}
}
function lineP(g,P,p1,p2,c,lw){
  var a=P(p1[0],p1[1]),b=P(p2[0],p2[1]);
  g.strokeStyle=c;g.lineWidth=lw||1;
  g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
}

  g.fillStyle=col;

function Particle(p,v,life,color,size){

function Missile(x,y,a,speed,dmg,color,friendly,r,opts){
  opts=opts||{};
  this.x=x;this.y=y;this.angle=a;
  this.vx=Math.cos(a)*speed;this.vy=Math.sin(a)*speed;this.speed=speed;
  this.dmg=dmg;this.color=color;this.friendly=friendly;
  this.r=r||4;this.life=0;this.alive=true;this.smokeTimer=0;
  this.homing=!!opts.homing;this.turnRate=opts.turnRate||3.5;
  this.target=opts.target||null;
  this.aoeRadius=opts.aoeRadius||0;this.aoeDmg=opts.aoeDmg||0;
  this.big=!!opts.big;this.knockback=opts.knockback||0;
  this.canHitBoss=!!opts.canHitBoss;
  this.frozenT=0;
}
Missile.prototype.update=function(dt){
  if(this.frozenT>0){
    this.frozenT-=dt;
    this.smokeTimer=1;
    return;
  }
  this.life+=dt;
  if(this.homing){
    if(!this.target||!this.target.alive){
      if(this.friendly){
        var best=null,bd=Infinity;
        for(var i=0;i<enemies.length;i++){
          var e=enemies[i];if(!e.alive)continue;
          var d=(e.x-this.x)*(e.x-this.x)+(e.y-this.y)*(e.y-this.y);
          if(d<bd){bd=d;best=e}
        }
        if(boss&&boss.alive&&!boss.dying){
          var d2=(boss.x-this.x)*(boss.x-this.x)+(boss.y-this.y)*(boss.y-this.y);
          if(d2<bd){bd=d2;best=boss}
        }
        this.target=best;
      } else this.target=(player&&player.alive)?player:null;
    }
    if(this.target){
      var dx=this.target.x-this.x,dy=this.target.y-this.y;
      var w=Math.atan2(dy,dx);
      var df=w-this.angle;
      while(df>Math.PI)df-=TAU;
      while(df<-Math.PI)df+=TAU;
      var mt=this.turnRate*dt;
      if(Math.abs(df)<mt)this.angle=w;else this.angle+=Math.sign(df)*mt;
      this.vx=Math.cos(this.angle)*this.speed;
      this.vy=Math.sin(this.angle)*this.speed;
    }
  }
  this.x+=this.vx*dt;this.y+=this.vy*dt;
  this.smokeTimer-=dt;
  if(this.smokeTimer<=0){
    this.smokeTimer=.025;
    var c=this.friendly?(this.big?[255,140,255]:[140,220,255]):(this.knockback>0?[255,60,80]:[255,140,120]);
    particles.push(new Particle(
      {x:this.x-Math.cos(this.angle)*this.r*1.2,y:this.y-Math.sin(this.angle)*this.r*1.2},
      {x:-Math.cos(this.angle)*40+rand(-15,15),y:-Math.sin(this.angle)*40+rand(-15,15)},
      .4,c,rand(1.5,this.big?4:2.5)
    ));
  }
  if(this.x<-80||this.x>W+80||this.y<-80||this.y>H+80)this.alive=false;
};
Missile.prototype.draw=function(g){
  var col;
  if(this.friendly)col=this.big?'#ffc0ff':'#ffff8c';
  else if(this.knockback>0)col='#ff3040';
  else col='#ff6464';
  drawMissile(g,this.x,this.y,this.angle,this.r,col,this.life,this.big);
  if(this.frozenT>0){
    g.fillStyle='rgba(140,220,255,.55)';
    g.beginPath();g.arc(this.x,this.y,this.r*1.6,0,TAU);g.fill();
    g.strokeStyle='rgba(220,245,255,.95)';g.lineWidth=2;
    g.beginPath();g.arc(this.x,this.y,this.r*1.6,0,TAU);g.stroke();
  }
};

function Player(shipId){

  this.hp=this.maxhp;
  this.energy=mult*50;this.maxEnergy=mult*100;
  this.rate=0.16/def.rate;
  this.cd=0;this.ultCd=0;
  this.invuln=1.5;this.alive=true;
  this.thrust=0;
  this.speed=Math.min(W,H)*.72*def.speed;
  this.size=22;
  this.laserActive=false;this.laserDamageTick=0;
  this.kbVx=0;this.kbVy=0;
}
Player.prototype.update=function(dt){
  var ax=0,ay=0;
  if(keys['a']||keys['arrowleft'])ax-=1;
  if(keys['d']||keys['arrowright'])ax+=1;
  if(keys['w']||keys['arrowup'])ay-=1;
  if(keys['s']||keys['arrowdown'])ay+=1;
  if(joy.active){
    var dx=joy.x-joy.cx,dy=joy.y-joy.cy;
    if(Math.hypot(dx,dy)>6){ax=dx/joy.max;ay=dy/joy.max}
  }
  var ml=Math.hypot(ax,ay);
  if(ml>.05){ax/=ml;ay/=ml;this.thrust=Math.min(1,this.thrust+dt*6)}
  else this.thrust=Math.max(0,this.thrust-dt*6);

  var vx=ax*this.speed,vy=ay*this.speed;
  this.x+=vx*dt+this.kbVx*dt;
  this.y+=vy*dt+this.kbVy*dt;
  var dk=Math.exp(-dt*3.5);
  this.kbVx*=dk;this.kbVy*=dk;
  if(Math.abs(this.kbVx)<1)this.kbVx=0;
  if(Math.abs(this.kbVy)<1)this.kbVy=0;

  var pad=26;
  this.x=Math.max(pad,Math.min(W-pad,this.x));
  this.y=Math.max(pad,Math.min(H-pad,this.y));
  this.angle=-Math.PI/2;
  this.invuln=Math.max(0,this.invuln-dt);
  this.cd=Math.max(0,this.cd-dt);
  this.ultCd=Math.max(0,this.ultCd-dt);
};
Player.prototype.shoot=function(){

Player.prototype.draw=function(g){

var cheats={unlocked:false,damageMul:1,unlimitedEnergy:false,godMode:false};

function tryUltimate(){
  if(!started||gameOver||paused)return;
  if(!player||!player.alive)return;
  if(player.ultCd>0)return;

  if(player.shipId==='phantom'){
    if(player.energy<50)return;
    player.energy-=50;
    player.ultCd=5;
    SFX.iceBurst();
    var fullRadius=Math.hypot(W,H);
    phantomAuras.push({
      x:player.x,y:player.y,
      radius:30,maxRadius:fullRadius,
      life:4
    });
    for(var pp=0;pp<60;pp++){
      var a=rand(0,TAU),sp=rand(80,350);
      particles.push(new Particle(
        {x:player.x,y:player.y},
        {x:Math.cos(a)*sp,y:Math.sin(a)*sp},
        rand(.7,1.6),[140,220,255],rand(2,5)
      ));
    }
    return;
  }

  if(player.energy<30)return;
  player.energy-=30;
  player.ultCd=5;
  SFX.ultFire();
  var all=[];
  for(var i=0;i<enemies.length;i++)if(enemies[i].alive)all.push(enemies[i]);
  if(boss&&boss.alive&&!boss.dying)all.push(boss);
  all.sort(function(a,b){
    return ((a.x-player.x)*(a.x-player.x)+(a.y-player.y)*(a.y-player.y))-
           ((b.x-player.x)*(b.x-player.x)+(b.y-player.y)*(b.y-player.y));
  });
  var dx=Math.cos(player.angle),dy=Math.sin(player.angle);
  for(var j=0;j<3;j++){
    var sx=-dy,sy=dx;
    var off=(j-1)*18;
    var tgt=all[j%Math.max(1,all.length)]||null;
    playerBullets.push(new Missile(
      player.x+dx*36+sx*off,player.y+dy*36+sy*off,player.angle,
      650,5,0xff80ff,true,6,
      {homing:true,turnRate:3.5,target:tgt,aoeRadius:110,aoeDmg:4,big:true}
    ));
  }
}

function updateLaserHold(dt){
  if(!player||!player.alive){if(player)player.laserActive=false;return}
  var want=skillBtn.active||keys['g'];
  var isPhantom=player.shipId==='phantom';

  if(want&&player.energy>0){
    player.laserActive=true;
    player.energy=Math.max(0,player.energy-(isPhantom?10:30)*dt);
    player.laserDamageTick-=dt;
    if(player.laserDamageTick<=0){
      player.laserDamageTick=.12;
      SFX.laserTick();
      var bw=isPhantom?20:34;
      for(var i=0;i<enemies.length;i++){
        var e=enemies[i];if(!e.alive)continue;
        if(e.y<player.y&&Math.abs(e.x-player.x)<bw+e.r){
          if(isPhantom){
            e.slowT=1.2;
            e.frost+=22;
            if(e.frost>=100&&e.frozenT<=0){e.frost=0;e.frozenT=1.0;e.frozenTick=0}
            e.hit(.4);
          } else e.hit(.6);
        }
      }
      if(boss&&boss.alive&&!boss.dying&&boss.y<player.y){
        if(Math.abs(boss.x-player.x)<bw+boss.size*3){
          if(isPhantom)boss.hit(.4);
          else boss.hit(.6);
        }
      }
      if(isPhantom){
        for(var p=0;p<2;p++){
          particles.push(new Particle(
            {x:player.x+rand(-10,10),y:player.y-rand(50,150)},
            {x:rand(-30,30),y:rand(-80,-20)},
            .35,[140,220,255],rand(1.5,2.5)
          ));
        }
      }
    }
  } else {
    player.laserActive=false;
    player.laserDamageTick=0;
  }

  for(var ai=phantomAuras.length-1;ai>=0;ai--){
    var aura=phantomAuras[ai];
    aura.life-=dt;
    if(aura.life<=0){phantomAuras.splice(ai,1);continue}
    aura.radius=Math.min(aura.maxRadius,aura.radius+dt*1200);
    for(var ei=0;ei<enemies.length;ei++){
      var en=enemies[ei];if(!en.alive)continue;
      var dx2=en.x-aura.x,dy2=en.y-aura.y;
      if(dx2*dx2+dy2*dy2<aura.radius*aura.radius){
        if(en.frozenT<=0){
          en.frozenT=2.5;
          en.frost=100;
          en.slowT=2.5;
          en.frozenTick=0;
          var aIc=rand(0,TAU),spIc=rand(60,200);
          for(var ic=0;ic<8;ic++){
            particles.push(new Particle(
              {x:en.x,y:en.y},
              {x:Math.cos(aIc+ic*.7)*spIc,y:Math.sin(aIc+ic*.7)*spIc},
              rand(.4,.9),[220,245,255],rand(2,4)
            ));
          }
        }
      }
    }
    for(var bi=0;bi<enemyBullets.length;bi++){
      var bu=enemyBullets[bi];
      if(!bu.alive||bu.friendly)continue;
      var bdx=bu.x-aura.x,bdy=bu.y-aura.y;
      if(bdx*bdx+bdy*bdy<aura.radius*aura.radius){
        if(bu.frozenT<=0){
          bu.frozenT=2.0;
          var aIb=rand(0,TAU),spIb=rand(40,120);
          for(var icb=0;icb<4;icb++){
            particles.push(new Particle(
              {x:bu.x,y:bu.y},
              {x:Math.cos(aIb+icb*1.5)*spIb,y:Math.sin(aIb+icb*1.5)*spIb},
              rand(.3,.6),[220,245,255],rand(1.5,3)
            ));
          }
        }
      }
    }
  }
}

function explodeAoE(x,y,r,dmg,ignore){
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive||e===ignore)continue;
    var dx=e.x-x,dy=e.y-y;
    if(dx*dx+dy*dy<(r+e.r)*(r+e.r))e.hit(dmg);
  }
  if(boss&&boss.alive&&!boss.dying&&boss!==ignore){

  }
  for(var j=0;j<30;j++){
    var a=rand(0,TAU),sp=rand(150,r*3.5);

var TYPES={

  fighter:{hp:2,r:19,speed:80,color:'#ffb43c',score:20,fire:2.0,dmg:8,energy:5},

function Enemy(kind,x,y,isMinion){

  this.laneX=x;
  this.swingAmp=isMinion?rand(20,40):rand(30,60);
  this.swingFreq=rand(.8,1.4);
  if(isMinion){this.speed*=1.5;this.fireRate*=.7}
  this.slowT=0;
  this.frost=0;
  this.frozenT=0;
  this.frozenTick=0;
}
Enemy.prototype.update=function(dt,pl){
  if(this.frozenT>0){
    this.frozenT-=dt;
    this.frozenTick-=dt;
    if(this.frozenTick<=0){
      this.frozenTick=.5;
      this.hp-=0.4;
      if(this.hp<=0){
        this.alive=false;
        SFX.explode();
        if(player)player.energy=Math.min(player.maxEnergy,player.energy+this.energyValue);
        var rgbD=hex2rgb(this.color);
        for(var di=0;di<18;di++){
          var ad=rand(0,TAU),spd=rand(80,380);
          particles.push(new Particle({x:this.x,y:this.y},{x:Math.cos(ad)*spd,y:Math.sin(ad)*spd},rand(.3,.8),rgbD,rand(2,5)));
        }
        return;
      }
    }
    if(this.frozenT<=0){
      this.frost=0;
      this.slowT=1.2;
      this.frozenTick=0;
    }
    return;
  }
  this.slowT=Math.max(0,this.slowT-dt);
  this.frost=Math.max(0,this.frost-dt*25);
  var moveMul=this.slowT>0?0.35:1;
  var fireMul=this.slowT>0?0.5:1;

  this.ftime-=dt*fireMul;
  this.flash=Math.max(0,this.flash-dt);
  this.wobble+=dt*this.swingFreq*moveMul;
  this.x=this.laneX+Math.sin(this.wobble)*this.swingAmp;
  this.y+=this.speed*moveMul*dt;

  if(this.ftime<=0&&this.y>0&&this.y<H*.75){
    this.ftime=this.fireRate;
    enemyBullets.push(new Missile(this.x,this.y+this.r,Math.PI/2,this.kind==='tank'?240:320,this.dmg,0xff6464,false,3));
    SFX.ebullet();
  }
  if(this.y>H+80)this.alive=false;
};

    var rgb=hex2rgb(this.color);

    g.beginPath();g.arc(this.x,this.y,this.r*1.25,0,TAU);g.fill();
    g.strokeStyle='rgba(160,220,255,0.6)';g.lineWidth=1.5;
    g.beginPath();g.arc(this.x,this.y,this.r*1.25,0,TAU);g.stroke();
  } else if(this.frost>30){
    var fa2=Math.min(0.3,this.frost/100*0.3);
    g.fillStyle='rgba(120,200,255,'+fa2+')';
    g.beginPath();g.arc(this.x,this.y,this.r*1.15,0,TAU);g.fill();
  }

  if(this.hp<this.maxhp&&this.hp>0){
    var bw=this.r*2;
    g.fillStyle='#28283a';g.fillRect(this.x-bw/2,this.y-this.r-14,bw,3);
    g.fillStyle='#64ff78';g.fillRect(this.x-bw/2,this.y-this.r-14,bw*this.hp/this.maxhp,3);
  }
};

function hex2rgb(h){
  var n=parseInt(h.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}

function Boss(kind,tier){
  var def=BOSS_KINDS[kind];
  this.kind=kind;this.tier=tier||0;
  this.name=def.name;
  this.maxhp=Math.round(def.baseHp*(1+this.tier*.5));
  this.hp=this.maxhp;
  this.size=Math.min(W,H)*def.size;
  this.accent=def.accent;
  this.x=W/2;this.y=-300;
  this.alive=true;this.flash=0;this.corePulse=0;
  this.swayT=0;
  this.swayAmp=W*(kind===2?.24:kind===4?.2:.18);
  this.swaySpeed=kind===2?.85:kind===4?.65:.55;
  this.entering=true;
  this.targetY=Math.min(H*.22,200);
  this.fireTimer=2.5;this.summonTimer=6;
  this.charging=false;this.chargeTimer=0;
  this.deathTimer=0;this.dying=false;
  this.cloakTimer=0;this.cloakCd=0;
  this.laserWarn=0;this.laserFire=0;
  this.specialCd=kind===3?6:4;
  this.skillPhase='idle';this.skillIndex=0;this.skillTimer=0;
  this.laserBeams=[];this.laserLife=0;
}
Boss.prototype.update=function(dt,pl){
  this.corePulse=(Math.sin(performance.now()*.004)+1)/2;
  this.flash=Math.max(0,this.flash-dt);
  this.cloakTimer=Math.max(0,this.cloakTimer-dt);
  this.cloakCd=Math.max(0,this.cloakCd-dt);
  this.laserWarn=Math.max(0,this.laserWarn-dt);
  this.laserFire=Math.max(0,this.laserFire-dt);
  if(this.dying){
    this.deathTimer-=dt;
    if(Math.random()<.9){
      var a=rand(0,TAU),sp=rand(80,400);
      particles.push(new Particle(
        {x:this.x+rand(-50,50),y:this.y+rand(-50,50)},
        {x:Math.cos(a)*sp,y:Math.sin(a)*sp},
        rand(.5,1.2),Math.random()<.5?[255,200,80]:hex2rgb(this.accent),rand(2,5)
      ));
    }
    if(this.deathTimer<=0){
      this.alive=false;
      SFX.bossDie();
      for(var i=0;i<120;i++){
        var a2=rand(0,TAU),sp2=rand(150,800);
        particles.push(new Particle(
          {x:this.x,y:this.y},
          {x:Math.cos(a2)*sp2,y:Math.sin(a2)*sp2},
          rand(.7,1.8),Math.random()<.4?[255,255,200]:hex2rgb(this.accent),rand(3,8)
        ));
      }
      score+=5000+this.tier*2000;
      if(pl)pl.energy=Math.min(pl.maxEnergy,pl.energy+50);
      setMusicTheme('normal');
    }
    return;
  }
  if(this.entering){
    this.y+=(this.targetY-this.y)*Math.min(1,dt*1.5);
    if(this.y>this.targetY-3)this.entering=false;
    return;
  }
  this.swayT+=dt*this.swaySpeed;
  this.x=W/2+Math.sin(this.swayT)*this.swayAmp;
  this.y=this.targetY+Math.sin(this.swayT*1.5)*15;

  if(this.kind===1)this._u1(dt,pl);
  else if(this.kind===2)this._u2(dt,pl);
  else if(this.kind===3)this._u3(dt,pl);
  else this._u4(dt,pl);
};
Boss.prototype._u1=function(dt,pl){
  if(this.charging){
    this.chargeTimer-=dt;
    if(this.chargeTimer<=0){this.charging=false;this._fan()}
  } else {
    this.fireTimer-=dt;
    if(this.fireTimer<=0){this.fireTimer=rand(2.2,3.2);this.charging=true;this.chargeTimer=.7}
  }
  this.summonTimer-=dt;
  if(this.summonTimer<=0){this.summonTimer=rand(6,8);this._summon(3)}
};
Boss.prototype._fan=function(){
  var bx=this.x,by=this.y+this.size*3.4;
  for(var i=-3;i<=3;i++){
    enemyBullets.push(new Missile(bx+i*this.size*.7,by,Math.PI/2+i*.13,280,12,0xff40a0,false,4,{canHitBoss:true}));
  }
  for(var j=-1;j<=1;j+=2){
    enemyBullets.push(new Missile(bx+j*this.size*2.6,by,Math.PI/2,320,15,0xff40a0,false,4,{canHitBoss:true}));
  }
  tone(220,.15,'sawtooth',.1,80);
};
Boss.prototype._summon=function(n){
  var ks=['scout','fighter','scout','fighter','tank'];
  for(var i=0;i<n;i++){
    var kx=this.x+(i-(n-1)/2)*this.size*1.6+rand(-30,30);
    var ky=this.y+this.size*2;
    enemies.push(new Enemy(ks[i%ks.length],kx,ky,true));
  }
  tone(180,.4,'triangle',.1,400);
};
Boss.prototype._u2=function(dt,pl){
  this.fireTimer-=dt;
  if(this.fireTimer<=0){
    this.fireTimer=rand(.6,1);
    var bx=this.x,by=this.y+this.size*2.6;
    for(var i=0;i<3;i++){
      enemyBullets.push(new Missile(bx+(i-1)*this.size*.5,by,Math.PI/2,400,8,0x60e0ff,false,3,{canHitBoss:true}));
    }
  }
  if(this.cloakCd<=0&&this.cloakTimer<=0){this.cloakTimer=1.8;this.cloakCd=rand(5,7)}
  this.summonTimer-=dt;
  if(this.summonTimer<=0){
    this.summonTimer=3.5;
    var bx2=this.x,by2=this.y+this.size*2.6;
    var ang=Math.atan2(pl.y-by2,pl.x-bx2);
    for(var j=-2;j<=2;j++){
      enemyBullets.push(new Missile(bx2,by2,ang+j*.1,340,6,0x60e0ff,false,3,{canHitBoss:true}));
    }
  }
};
Boss.prototype._u3=function(dt,pl){
  this.summonTimer-=dt;this.specialCd-=dt;
  if(this.laserWarn>0){
    if(this.laserWarn<=.001&&this.laserFire<=0){
      this.laserFire=.25;
      if(Math.abs(pl.x-this.x)<80)pl.hit(30);
    }
  } else if(this.laserFire>0){
  } else {
    this.fireTimer-=dt;
    if(this.fireTimer<=0){
      this.fireTimer=rand(.9,1.4);
      var bx=this.x,by=this.y+this.size*3;
      for(var i=-4;i<=4;i++){
        enemyBullets.push(new Missile(bx+i*this.size*.55,by,Math.PI/2+i*.07,260,10,0xff8040,false,4,{canHitBoss:true}));
      }
    }
  }
  if(this.summonTimer<=0){this.summonTimer=rand(5,6.5);this._summon(4)}
  if(this.specialCd<=0){this.specialCd=rand(7,9);this.laserWarn=1.2}
};
Boss.prototype._u4=function(dt,pl){
  this.skillTimer-=dt;
  if(this.skillPhase==='idle'){
    if(this.skillTimer<=0){this.skillPhase='warn';this.skillTimer=.9;SFX.bossWarn()}
  } else if(this.skillPhase==='warn'){
    if(this.skillTimer<=0){this.skillPhase='exec';this._exec(pl);this.skillTimer=1}
  } else if(this.skillPhase==='exec'){
    if(this.skillTimer<=0){this.skillPhase='cooldown';this.skillTimer=1.5}
  } else if(this.skillPhase==='cooldown'){
    if(this.skillTimer<=0){this.skillPhase='idle';this.skillIndex=(this.skillIndex+1)%3;this.skillTimer=2}
  }
  if(this.laserBeams.length>0){
    this.laserLife-=dt;
    if(this.laserLife<=0)this.laserBeams=[];
  }
};
Boss.prototype._exec=function(pl){
  if(this.skillIndex===0)this._b4Sum();
  else if(this.skillIndex===1)this._b4Laser();
  else this._b4Miss(pl);
};
Boss.prototype._b4Sum=function(){
  SFX.bossSummon();
  var ks=['scout','scout','fighter','fighter','scout','tank'];
  for(var i=0;i<6;i++){
    var kx=this.x+(i-2.5)*this.size*1.5+rand(-30,30);
    var ky=this.y+this.size*2;
    enemies.push(new Enemy(ks[i],kx,ky,true));
  }
};
Boss.prototype._b4Laser=function(){
  this.laserBeams=[];
  for(var i=-1;i<=1;i++)this.laserBeams.push({xOffset:i*this.size*1.6,life:1.4});
  this.laserLife=1.4;
  SFX.laserOn();
};
Boss.prototype._b4Miss=function(pl){
  SFX.bossMissiles();
  var by=this.y+this.size*2;
  for(var i=0;i<5;i++){
    var off=(i-2)*this.size*.7;
    var sx=this.x+off;
    var sy=by;
    var a=Math.atan2(pl.y-sy,pl.x-sx);
    enemyBullets.push(new Missile(sx,sy,a,380,15,0xff3040,false,5,
      {homing:true,turnRate:2.5,target:pl,knockback:450,canHitBoss:true}));
  }
};
Boss.prototype.hit=function(d){
  if(this.dying)return;
  this.hp-=d;
  this.flash=.08;
  if(this.hp<=0){
    this.hp=0;this.dying=true;this.deathTimer=2.5;
    if(music)music.stop(true);
    SFX.bossDie();
  }
};

var particles=[],enemies=[],playerBullets=[],enemyBullets=[];
var stars=[],player=null,boss=null;
var score=0,wave=1;
var spawnTimer=0,spawnInterval=3.5;
var gameOver=false,started=false;
var runCoins=0;
var lastCoinScore=0;

function initStars(){stars=[];for(var i=0;i<150;i++)stars.push(new Star())}
function reset(){
  particles=[];enemies=[];
  playerBullets.length=0;
  enemyBullets.length=0;
  phantomAuras.length=0;
  player=new Player(saveData.selected);
  boss=null;
  score=0;wave=1;
  spawnTimer=0;spawnInterval=3.5;
  gameOver=false;paused=false;
  runCoins=0;
  lastCoinScore=0;
  currentMusicTheme='normal';
  initStars();
  document.getElementById('runCoins').textContent='0';
}
function isBossWave(w){return w>=30&&(w-30)%20===0}
function spawnWave(){
  if(isBossWave(wave)&&(!boss||!boss.alive)){
    var tier=Math.floor((wave-30)/20);
    var kind=(tier%3)+1;
    var isCrimson=(wave===50||wave===70||wave===110||wave===130||wave===170);
    var kk=isCrimson?4:kind;
    boss=new Boss(kk,tier);
    SFX.boss();
    setMusicTheme(kk===4?'boss2':'boss');
    wave++;spawnInterval=3.5;
    return;
  }
  var count=1+Math.ceil(wave/2);
  for(var i=0;i<count;i++){
    var r=Math.random();
    var kind;
    if(wave<2)kind='scout';
    else if(wave<4)kind=r<.7?'scout':'fighter';
    else if(wave<7)kind=r<.5?'scout':r<.9?'fighter':'tank';
    else kind=r<.35?'scout':r<.75?'fighter':'tank';
    enemies.push(new Enemy(kind,rand(60,W-60),rand(-320,-40)));
  }
  wave++;
  spawnInterval=Math.max(1.6,3.5-wave*.15);
}

function addScore(val){
  score+=val;
  while(score-lastCoinScore>=50){
    lastCoinScore+=50;
    runCoins++;
    document.getElementById('runCoins').textContent=runCoins;
  }
}

var last=performance.now();
var fps=0,fpsAccum=0,fpsFrames=0;

function loop(now){
  var dt=Math.min((now-last)/1000,.05);
  last=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=.5){fps=Math.round(fpsFrames/fpsAccum);fpsAccum=0;fpsFrames=0}
  if(started&&!paused)update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt){
  if(gameOver)return;
  player.update(dt);
  if(fireBtn.active||mouse.down||keys[' '])player.shoot();
  updateLaserHold(dt);
  if(cheats.unlimitedEnergy&&player){player.energy=player.maxEnergy}

  var bossActive=boss&&boss.alive&&!boss.dying;
  spawnTimer+=dt;
  if(!bossActive){
    var maxAlive=3+Math.floor(wave/2);
    if(spawnTimer>=spawnInterval&&enemies.length<maxAlive){spawnTimer=0;spawnWave()}
  }
  for(var i=0;i<enemies.length;i++)enemies[i].update(dt,player);
  if(boss&&boss.alive)boss.update(dt,player);
  for(var j=0;j<playerBullets.length;j++)playerBullets[j].update(dt);
  for(var k=0;k<enemyBullets.length;k++)enemyBullets[k].update(dt);
  for(var m=0;m<particles.length;m++)particles[m].update(dt);

  if(boss&&boss.alive&&boss.kind===4&&boss.laserBeams.length>0){
    var bw=40;
    for(var b=0;b<boss.laserBeams.length;b++){
      var bx=boss.x+boss.laserBeams[b].xOffset;
      if(player.alive&&Math.abs(player.x-bx)<bw){
        if(player.invuln<=0){
          player.hit(20);
          for(var p=0;p<8;p++){
            var a=rand(0,TAU);
            particles.push(new Particle(player,{x:Math.cos(a)*140,y:Math.sin(a)*140},.4,[255,60,80],2));
          }
        }
      }
    }
  }

  if(boss&&boss.alive&&!boss.dying){
    var bR2=boss.size*3.2;
    for(var ebc=0;ebc<enemyBullets.length;ebc++){
      var ebC=enemyBullets[ebc];
      if(!ebC.alive||!ebC.canHitBoss)continue;
      if(ebC.frozenT>0)continue;
      if(ebC.life<0.5)continue;
      var dxC=ebC.x-boss.x,dyC=ebC.y-boss.y;
      if(dxC*dxC+dyC*dyC<(bR2+ebC.r)*(bR2+ebC.r)){
        boss.hit(ebC.dmg*0.8);
        ebC.alive=false;
        for(var sp3=0;sp3<8;sp3++){
          var aC=rand(0,TAU),spC=rand(80,240);
          particles.push(new Particle({x:ebC.x,y:ebC.y},{x:Math.cos(aC)*spC,y:Math.sin(aC)*spC},.4,[255,140,140],2));
        }
      }
    }
  }

  for(var pb=0;pb<playerBullets.length;pb++){
    var bb=playerBullets[pb];
    if(!bb.alive)continue;
    for(var ee=0;ee<enemies.length;ee++){
      var en=enemies[ee];
      if(!en.alive)continue;
      var dx2=bb.x-en.x,dy2=bb.y-en.y;
      if(dx2*dx2+dy2*dy2<(en.r+bb.r)*(en.r+bb.r)){
        en.hit(bb.dmg*cheats.damageMul);
        if(bb.aoeRadius>0)explodeAoE(bb.x,bb.y,bb.aoeRadius,bb.aoeDmg,en);
        bb.alive=false;
        if(!en.alive){
          addScore(en.score);
          if(Math.random()<.2){
            if(Math.random()<.5)player.hp=Math.min(player.maxhp,player.hp+25);
            else player.rate=Math.max(.06,player.rate*.85);
            SFX.power();
          }
        }
        break;
      }
    }
  }

  if(boss&&boss.alive&&!boss.dying){
    var bR=boss.size*3.2;
    for(var pbb=0;pbb<playerBullets.length;pbb++){
      var pb2=playerBullets[pbb];
      if(!pb2.alive)continue;
      var dx3=pb2.x-boss.x,dy3=pb2.y-boss.y;
      if(dx3*dx3+dy3*dy3<(bR+pb2.r)*(bR+pb2.r)){
        boss.hit(pb2.dmg*cheats.damageMul);
        if(pb2.aoeRadius>0)explodeAoE(pb2.x,pb2.y,pb2.aoeRadius,pb2.aoeDmg,null);
        pb2.alive=false;
      }
    }
  }

  for(var eb=0;eb<enemyBullets.length;eb++){
    var bb2=enemyBullets[eb];
    if(!bb2.alive)continue;
    var dx4=bb2.x-player.x,dy4=bb2.y-player.y;
    if(dx4*dx4+dy4*dy4<(16+bb2.r)*(16+bb2.r)){
      player.hit(bb2.dmg);
      bb2.alive=false;
      if(bb2.knockback>0){
        var len=Math.hypot(player.x-bb2.x,player.y-bb2.y)||1;
        player.kbVx+=(player.x-bb2.x)/len*bb2.knockback;
        player.kbVy+=(player.y-bb2.y)/len*bb2.knockback;
        for(var q=0;q<16;q++){
          var a2=rand(0,TAU),sp2=rand(150,350);
          particles.push(new Particle(player,{x:Math.cos(a2)*sp2,y:Math.sin(a2)*sp2},.5,[255,80,100],3));
        }
      } else {
        for(var q2=0;q2<8;q2++){
          var a3=rand(0,TAU);
          particles.push(new Particle(player,{x:Math.cos(a3)*140,y:Math.sin(a3)*140},.4,[255,80,80],2));
        }
      }
    }
  }

  for(var enb=0;enb<enemies.length;enb++){
    var enb1=enemies[enb];
    if(!enb1.alive)continue;
    var dx5=enb1.x-player.x,dy5=enb1.y-player.y;
    if(dx5*dx5+dy5*dy5<(enb1.r+14)*(enb1.r+14)){player.hit(15);enb1.hit(2)}
  }
  if(boss&&boss.alive&&!boss.dying){
    var dx6=boss.x-player.x,dy6=boss.y-player.y;
    if(dx6*dx6+dy6*dy6<(boss.size*2+14)*(boss.size*2+14))player.hit(20);
  }

  for(var ci=playerBullets.length-1;ci>=0;ci--)if(!playerBullets[ci].alive)playerBullets.splice(ci,1);
  for(var ci2=enemyBullets.length-1;ci2>=0;ci2--)if(!enemyBullets[ci2].alive)enemyBullets.splice(ci2,1);
  enemies=enemies.filter(function(e){return e.alive});
  particles=particles.filter(function(p){return p.life>0});
  if(particles.length>900)particles.splice(0,particles.length-900);

  for(var si=0;si<stars.length;si++)stars[si].update(dt);

  if(!player.alive&&!gameOver){
    gameOver=true;
    SFX.gameover();
    if(music)music.stop();
    if(runCoins>0){
      saveData.coins+=runCoins;
      saveGame();
      SFX.coin();
    }
  }
}

function render(){
  ctx.fillStyle=BG;
  ctx.fillRect(0,0,W,H);
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(6,8,18,0)');
  vg.addColorStop(1,currentMusicTheme==='boss2'?'rgba(90,0,10,.7)':currentMusicTheme==='boss'?'rgba(60,0,20,.55)':'rgba(20,0,40,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  for(var si=0;si<stars.length;si++)stars[si].draw(ctx);
  for(var pi=0;pi<particles.length;pi++)particles[pi].draw(ctx);
  for(var ebi=0;ebi<enemyBullets.length;ebi++)enemyBullets[ebi].draw(ctx);
  for(var eni=0;eni<enemies.length;eni++)enemies[eni].draw(ctx);

  if(boss&&boss.alive){
    if(boss.kind===4&&boss.skillPhase==='warn'){
      ctx.strokeStyle='rgba(255,80,80,'+(.4+.4*Math.sin(performance.now()*.04))+')';
      ctx.lineWidth=4;
      ctx.setLineDash([14,10]);
      ctx.beginPath();ctx.moveTo(boss.x,boss.y+boss.size*3);ctx.lineTo(boss.x,H);ctx.stroke();
      ctx.setLineDash([]);
    }
    if(boss.kind===4&&boss.laserBeams.length>0){
      for(var lb=0;lb<boss.laserBeams.length;lb++){
        var bx=boss.x+boss.laserBeams[lb].xOffset;
        var by=boss.y+boss.size*3;
        var grd=ctx.createLinearGradient(bx,by,bx,H);
        grd.addColorStop(0,'rgba(255,240,240,.95)');
        grd.addColorStop(.15,'rgba(255,80,100,.85)');
        grd.addColorStop(1,'rgba(180,0,30,.3)');
        ctx.fillStyle=grd;ctx.fillRect(bx-30,by,60,H-by);
        ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(bx-5,by,10,H-by);
      }
    }
    drawBossSimple(ctx,boss);
  }

  for(var aui=0;aui<phantomAuras.length;aui++){
    var au=phantomAuras[aui];
    var tA=au.life/4;
    var alphaA=tA>0.5?1:(tA/0.5);
    var grA=ctx.createRadialGradient(au.x,au.y,au.radius*0.2,au.x,au.y,au.radius);
    grA.addColorStop(0,'rgba(140,220,255,0)');
    grA.addColorStop(0.6,'rgba(140,220,255,'+(0.18*alphaA)+')');
    grA.addColorStop(0.9,'rgba(200,240,255,'+(0.45*alphaA)+')');
    grA.addColorStop(1,'rgba(220,250,255,'+(0.7*alphaA)+')');
    ctx.fillStyle=grA;
    ctx.beginPath();ctx.arc(au.x,au.y,au.radius,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(220,250,255,'+(0.9*alphaA)+')';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(au.x,au.y,au.radius,0,TAU);ctx.stroke();

    var flakes=Math.floor(au.radius/12);
    if(flakes>100)flakes=100;
    var nowMs=performance.now()*0.001;
    for(var sf=0;sf<flakes;sf++){
      var seed=sf*137.508;
      var ang=(seed+nowMs*0.3)%TAU;
      var rFrac=((seed*3.14)%100)/100;
      var rad=rFrac*au.radius;
      var fx=au.x+Math.cos(ang)*rad;
      var fy=au.y+Math.sin(ang)*rad;
      var size=2.5+Math.sin(nowMs*3+sf)*1.2;
      ctx.save();
      ctx.translate(fx,fy);
      ctx.rotate(ang);
      ctx.beginPath();
      for(var arm=0;arm<6;arm++){
        ctx.rotate(Math.PI/3);
        ctx.moveTo(0,0);
        ctx.lineTo(0,-size);
      }
      ctx.strokeStyle='rgba(230,250,255,'+(0.9*alphaA)+')';
      ctx.lineWidth=1;
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,'+(0.9*alphaA)+')';
      ctx.beginPath();ctx.arc(fx,fy,1.2,0,TAU);ctx.fill();
    }
  }

  for(var pbi=0;pbi<playerBullets.length;pbi++)playerBullets[pbi].draw(ctx);
  if(player&&player.alive)player.draw(ctx);

  if(player){
    document.getElementById('hpfill').style.width=(player.hp/player.maxhp*100)+'%';
    document.getElementById('hpfill').style.background=player.hp>50*player.maxhp/100?'#64ff78':player.hp>25*player.maxhp/100?'#ffc850':'#ff5050';
    document.getElementById('efill').style.width=(player.energy/player.maxEnergy*100)+'%';
    document.getElementById('hpTxt').textContent='HP '+Math.ceil(player.hp)+'/'+player.maxhp;
    document.getElementById('scoretext').textContent='SCORE '+score;
    document.getElementById('wavetext').textContent='WAVE '+wave;
  }

  if(boss&&boss.alive){
    var barW=W-80;
    var barH=boss.kind===4?32:22;
    var bx2=40;
    var by2=boss.kind===4?92:88;
    ctx.fillStyle='rgba(20,0,20,.85)';ctx.fillRect(bx2-3,by2-3,barW+6,barH+6);
    ctx.strokeStyle=boss.kind===4?'#ff2040':boss.kind===2?'#20a0d0':boss.kind===3?'#ff6020':'#ff2060';
    ctx.lineWidth=boss.kind===4?3:2;
    ctx.strokeRect(bx2-3,by2-3,barW+6,barH+6);
    ctx.fillStyle='#200010';ctx.fillRect(bx2,by2,barW,barH);
    var hf=Math.max(0,boss.hp/boss.maxhp);
    var grad=ctx.createLinearGradient(bx2,by2,bx2+barW,by2);
    if(boss.kind===4){grad.addColorStop(0,'#8a0010');grad.addColorStop(.5,'#ff2030');grad.addColorStop(1,'#8a0010')}
    else if(boss.kind===2){grad.addColorStop(0,'#40a0ff');grad.addColorStop(1,'#a0e0ff')}
    else if(boss.kind===3){grad.addColorStop(0,'#ff5020');grad.addColorStop(1,'#ffa050')}
    else {grad.addColorStop(0,'#ff2050');grad.addColorStop(1,'#ff1040')}
    ctx.fillStyle=grad;ctx.fillRect(bx2,by2,barW*hf,barH);
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(bx2,by2,barW*hf,barH*.3);
    var nc=boss.kind===4?'#ff6080':boss.kind===2?'#60c0ff':boss.kind===3?'#ffa060':'#ff80a0';
    ctx.fillStyle=nc;
    ctx.font=boss.kind===4?'bold 16px monospace':'bold 13px monospace';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    var tt=boss.tier>0?'  ·  TIER '+(boss.tier+1):'';
    ctx.fillText('◤  '+boss.name+tt+'  ◢',W/2,by2-6);
    ctx.fillStyle='#ffd0e0';
    ctx.font=boss.kind===4?'bold 14px monospace':'bold 12px monospace';
    ctx.textBaseline='top';
    ctx.fillText(Math.ceil(boss.hp)+' / '+boss.maxhp,W/2,by2+barH+4);
  }

  if(joy.active){
    ctx.strokeStyle='rgba(90,220,255,.4)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(joy.cx,joy.cy,joy.max,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(90,220,255,.6)';
    ctx.beginPath();ctx.arc(joy.x,joy.y,26,0,TAU);ctx.fill();
  }

  var L=btnLayout();
  drawButton(L.fire,'#ff6464','FIRE',fireBtn.active);
  drawButton(L.skill,player&&player.shipId==='phantom'?'#80c8ff':'#5adcff','LASER',skillBtn.active||(player&&player.laserActive),player?player.energy>0:false);
  drawButton(L.ult,'#c860ff','ULT',ultBtn.active,player?(player.energy>=(player.shipId==='phantom'?50:30)&&player.ultCd<=0):false,player?player.ultCd:0);

  if(settings.showFps){
    ctx.fillStyle='#80ff80';ctx.font='bold 12px monospace';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('FPS '+fps,16,H-20);
  }

  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff5064';ctx.font='bold 42px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('GAME OVER',W/2,H/2-60);
    ctx.fillStyle='#ffd060';ctx.font='bold 20px monospace';
    ctx.fillText('🪙 +'+runCoins+' coins',W/2,H/2-10);
    ctx.fillStyle='#dce6ff';ctx.font='bold 18px monospace';
    ctx.fillText('Score: '+score+'  |  Wave '+wave,W/2,H/2+30);
    ctx.font='bold 14px monospace';
    ctx.fillStyle='#b4c8ff';
    ctx.fillText('Tap untuk kembali ke menu',W/2,H/2+70);
  }
}

function drawButton(btn,color,label,active,enabled,cd){
  enabled=enabled!==false;
  var alpha=enabled?1:.35;
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=active?color:color+'aa';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r,0,TAU);ctx.stroke();
  ctx.fillStyle=active?color+'66':(enabled?color+'22':'rgba(40,40,50,.4)');
  ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r,0,TAU);ctx.fill();
  if(cd&&cd>0){
    ctx.save();
    ctx.beginPath();ctx.arc(btn.x,btn.y,btn.r,-Math.PI/2,-Math.PI/2+TAU*(1-cd/5));
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle=enabled?color:'#808090';
  ctx.font='bold '+(btn.r>40?14:12)+'px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,btn.x,btn.y);
  if(cd&&cd>0){
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';
    ctx.fillText(cd.toFixed(1),btn.x,btn.y+14);
  }
  ctx.globalAlpha=1;
}

function renderShipCard(canvas,shipId){
  var g=canvas.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,canvas.width,canvas.height);
  g.fillStyle='#060812';
  g.fillRect(0,0,canvas.width,canvas.height);
  var cx=canvas.width/2,cy=canvas.height/2;
  if(shipId==='phantom')drawShipPhantom(g,cx,cy,-Math.PI/2,12,0.3);
  else drawShipViper(g,cx,cy,-Math.PI/2,12,0.3);
}

function refreshHintUI(){
  document.getElementById('totalCoins').textContent=saveData.coins;
  var wrap=document.getElementById('shipPreview');
  wrap.innerHTML='';
  Object.keys(SHIPS).forEach(function(key){
    var def=SHIPS[key];
    var owned=saveData.owned.indexOf(key)>=0||saveData.allUnlocked;
    var card=document.createElement('div');
    card.className='shipCard';
    if(key===saveData.selected)card.classList.add('selected');
    if(!owned)card.classList.add('locked');
    var cvv=document.createElement('canvas');
    cvv.width=100;cvv.height=60;
    card.appendChild(cvv);
    var nm=document.createElement('div');nm.className='sname';nm.textContent=def.name;
    card.appendChild(nm);
    var info=document.createElement('div');info.className='sinfo';
    info.innerHTML='SPD '+(def.speed).toFixed(2)+'x · RATE '+(def.rate).toFixed(2)+'x<br>HP '+Math.round(def.hp*100);
    card.appendChild(info);
    var price=document.createElement('div');
    if(owned){
      price.className='sowned';
      price.textContent=key===saveData.selected?'✓ SELECTED':'✓ OWNED';
    } else {
      price.className='sprice';
      price.textContent='🪙 '+def.price;
    }
    card.appendChild(price);
    card.addEventListener('click',function(){
      if(owned){
        saveData.selected=key;saveGame();refreshHintUI();SFX.missile();
      } else {
        if(saveData.coins>=def.price){
          saveData.coins-=def.price;
          saveData.owned.push(key);
          saveData.selected=key;
          saveGame();refreshHintUI();SFX.buy();
        } else {
          price.style.color='#ff6060';
          price.textContent='KURANG 🪙 '+(def.price-saveData.coins);
          setTimeout(function(){price.style.color='#ffd060';price.textContent='🪙 '+def.price},1200);
        }
      }
    });
    wrap.appendChild(card);
    renderShipCard(cvv,key);
  });
}

var codeBtn=document.getElementById('codeBtn');
var codeWrap=document.getElementById('codeInputWrap');
var codeInput=document.getElementById('codeInput');
var codeMsg=document.getElementById('codeMsg');
codeBtn.addEventListener('click',function(){codeWrap.style.display='block';codeInput.focus();codeMsg.textContent=''});
document.getElementById('codeCancel').addEventListener('click',function(){codeWrap.style.display='none';codeInput.value='';codeMsg.textContent=''});
document.getElementById('codeOk').addEventListener('click',function(){
  var v=(codeInput.value||'').trim().toUpperCase();
  if(v==='RASEMAN'){
    saveData.allUnlocked=true;
    Object.keys(SHIPS).forEach(function(k){
      if(saveData.owned.indexOf(k)<0)saveData.owned.push(k);
    });
    saveGame();refreshHintUI();
    codeMsg.style.color='#64ff78';codeMsg.textContent='✓ Semua pesawat terbuka!';
    SFX.buy();
    setTimeout(function(){codeWrap.style.display='none';codeInput.value='';codeMsg.textContent=''},1500);
  } else {
    codeMsg.style.color='#ff6060';codeMsg.textContent='✗ Code salah';
    setTimeout(function(){codeMsg.textContent=''},1200);
  }
});
codeInput.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('codeOk').click()});

var cheatModal=document.getElementById('cheatModal');
var cheatInput=document.getElementById('cheatCodeInput');
var cheatPanel=document.getElementById('cheatPanel');
var cheatBtn=document.getElementById('cheatBtn');

document.getElementById('cheatCodeBtn').addEventListener('click',function(){
  cheatModal.style.display='flex';cheatInput.value='';cheatInput.focus();
});
document.getElementById('cheatCodeCancel').addEventListener('click',function(){
  cheatModal.style.display='none';
});
document.getElementById('cheatCodeOk').addEventListener('click',function(){
  var v=(cheatInput.value||'').trim().toUpperCase();
  cheatModal.style.display='none';
  if(v==='ASEWAM'){
    cheats.unlocked=true;
    cheatBtn.style.display='flex';
    alert('✓ Cheat unlocked');
  } else {
    alert('✗ Code salah');
  }
});
cheatInput.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('cheatCodeOk').click()});
cheatBtn.addEventListener('click',function(){cheatPanel.style.display=cheatPanel.style.display==='block'?'none':'block'});
document.getElementById('cheatClose').addEventListener('click',function(){cheatPanel.style.display='none'});
document.getElementById('cheatWaveGo').addEventListener('click',function(){
  var w=parseInt(document.getElementById('cheatWave').value)||1;
  wave=Math.max(1,w);enemies=[];
  if(boss){boss.alive=false;boss=null}
  spawnTimer=0;spawnInterval=3.5;
  cheatPanel.style.display='none';
});
document.getElementById('cheatDmg').addEventListener('input',function(e){
  cheats.damageMul=parseInt(e.target.value)||1;
  document.getElementById('cheatDmgVal').textContent=cheats.damageMul+'x';
});
document.getElementById('cheatEnergyT').addEventListener('click',function(e){
  cheats.unlimitedEnergy=!cheats.unlimitedEnergy;
  e.currentTarget.style.background=cheats.unlimitedEnergy?'rgba(255,96,96,.4)':'#1a2a3a';
  e.currentTarget.firstElementChild.style.left=cheats.unlimitedEnergy?'24px':'2px';
});
document.getElementById('cheatGodT').addEventListener('click',function(e){
  cheats.godMode=!cheats.godMode;
  e.currentTarget.style.background=cheats.godMode?'rgba(255,96,96,.4)':'#1a2a3a';
  e.currentTarget.firstElementChild.style.left=cheats.godMode?'24px':'2px';
});

document.getElementById('startBtn').addEventListener('click',function(){
  initAudio();
  if(actx&&actx.state==='suspended')actx.resume();
  if(actx&&!music)music=new SpaceMusic(actx);
  if(music){music.theme='normal';music.start()}
  currentMusicTheme='normal';
  SFX.start();
  document.getElementById('hint').style.display='none';
  showSettingsBtn(true);
  reset();started=true;last=performance.now();
});

cv.addEventListener('click',function(){if(gameOver)backToMenu()});

function backToMenu(){
  gameOver=true;started=false;paused=false;
  document.getElementById('hint').style.display='flex';
  showSettingsBtn(false);
  if(music)music.stop();
  refreshHintUI();
}

refreshHintUI();
requestAnimationFrame(loop);
})();
</script>
